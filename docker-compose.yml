services:
  nordvpn:
    build:
      context: .
      dockerfile: Dockerfile-nordvpn
    cap_add:
    - NET_ADMIN
    sysctls:
    - net.ipv6.conf.all.disable_ipv6=0
    environment:
      NORDVPN_TOKEN: "<add access token here>"
    ports:
      - 8080:8080
    restart: unless-stopped
    healthcheck:
      test: /connect.sh
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 3s
  qbittorrent:
    build:
      context: .
      dockerfile: Dockerfile-qbittorrent
    network_mode: service:nordvpn
    command: [ '--profile=/opt' ]
    user: 1000:1000
    volumes:
      - C:\Downloads:/opt/qBittorrent/downloads
      - qbittorrent-data:/opt/qBittorrent/data
    restart: unless-stopped
    depends_on:
      nordvpn:
        condition: service_healthy
        restart: true

volumes:
  qbittorrent-data:

